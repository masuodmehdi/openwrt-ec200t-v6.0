name: Build OpenWrt for HLK7628N + EC200T

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.config'
      - 'files/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3 python3-pip rsync
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Clone EC200T source code
        run: |
          # نکته کلیدی: به جای مخزن رسمی، مخزن EC200T را clone کنید
          git clone https://github.com/Viperdk2020/openwrt-ec200t-v6.0 openwrt
          cd openwrt
          # اگر مخزن شاخه خاصی دارد، می‌توانید در اینجا checkout کنید، به طور پیش‌فرض از شاخه پیش‌فرض استفاده می‌شود

      - name: Load custom feeds
        run: |
          cd openwrt
          # feeds پیش‌فرض را به‌روزرسانی کنید (مخزن EC200T خود بر اساس OpenWrt رسمی است، بنابراین feeds رسمی را نگه دارید)
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom configuration and files
        run: |
          cd openwrt
          # فایل .config را از مخزن خود کپی کنید (از قبل در مخزن شما قرار داده شده است)
          cp ../.config .config
          # فایل‌های سفارشی (پیکربندی شبکه، اسکریپت‌های مودم و غیره) را کپی کنید
          if [ -d "../files" ]; then
            cp -r ../files ./files
          fi
          # پیکربندی را گسترش دهید تا مطمئن شوید وابستگی‌ها به طور خودکار انتخاب می‌شوند
          make defconfig

      - name: Download package
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the firmware
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          # اگر شکست خورد، دوباره با تک‌رشته و خروجی دقیق تلاش کنید

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-HLK7628N-EC200T
          path: openwrt/bin/targets/*/*/*
